name: tests

# Runs VANTA's own self-test suite on every push and pull request. The suite is the
# project's contract: it parses every script, then executes the unit and integration
# tests (scenario schema, weapons, hit registration, scoring, sensitivity, save layer).
#
# The engine version is pinned in .github/godot-version.txt so a test that passes
# locally passes here, and vice versa.

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: self test (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned version
        id: pin
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < .github/godot-version.txt)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Pinned Godot version: $VERSION"

      - name: Install pinned Godot
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${{ steps.pin.outputs.version }}"
          curl --fail --location --retry 4 --retry-all-errors \
            -o godot.zip "$BASE/Godot_v${{ steps.pin.outputs.version }}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${{ steps.pin.outputs.version }}_linux.x86_64" godot
          chmod +x godot
          ./godot --version

      - name: Self test
        run: GODOT="$PWD/godot" ./tools/test.sh

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-log
          path: |
            build/test.log
          if-no-files-found: ignore
