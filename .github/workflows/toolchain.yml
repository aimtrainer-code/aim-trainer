name: toolchain

# Produces the pinned Godot toolchain as downloadable artifacts.
#
# Why this exists: some development sandboxes (and locked-down corporate
# networks) cannot reach the CDN that GitHub uses for release assets, but they
# can reach github.com and the Actions API. This job runs inside GitHub's
# infrastructure, fetches the *official* Godot binaries for the version pinned
# in `.github/godot-version.txt`, verifies them and republishes them as workflow
# artifacts so the same pinned toolchain can be installed reproducibly
# everywhere.
#
# It is NOT part of the product build. The product build is `.github/workflows/release.yml`.

on:
  push:
    paths:
      - ".github/godot-version.txt"
      - ".github/workflows/toolchain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    name: fetch ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'pinned' }} toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: ${{ vars.GODOT_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned version
        id: pin
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < .github/godot-version.txt)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Pinned Godot version: $VERSION"

      - name: Download official Linux editor
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${{ steps.pin.outputs.version }}"
          curl --fail --location --retry 4 --retry-all-errors \
            -o editor.zip "$BASE/Godot_v${{ steps.pin.outputs.version }}_linux.x86_64.zip"
          curl --fail --location --retry 4 --retry-all-errors \
            -o templates.tpz "$BASE/Godot_v${{ steps.pin.outputs.version }}_export_templates.tpz"
          ls -l editor.zip templates.tpz

      - name: Verify and unpack Windows export templates
        run: |
          set -euo pipefail
          mkdir -p dist/templates
          unzip -o -q templates.tpz "templates/windows_release_x86_64.exe" "templates/windows_debug_x86_64.exe" "templates/version.txt" -d tpz
          cp tpz/templates/windows_release_x86_64.exe dist/templates/
          cp tpz/templates/windows_debug_x86_64.exe dist/templates/
          cp tpz/templates/version.txt dist/templates/
          rm -f templates.tpz editor.zip
          (cd dist/templates && zip -q -9 ../godot-templates-windows.zip windows_release_x86_64.exe windows_debug_x86_64.exe version.txt)
          rm -rf dist/templates
          ls -l dist

      - name: Checksums
        run: |
          set -euo pipefail
          sha256sum editor.zip dist/godot-templates-windows.zip | tee dist/TOOLCHAIN-SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: godot-linux-editor-${{ steps.pin.outputs.version }}
          path: editor.zip
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: godot-templates-windows-${{ steps.pin.outputs.version }}
          path: dist/godot-templates-windows.zip
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-checksums
          path: dist/TOOLCHAIN-SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Toolchain ${{ steps.pin.outputs.version }}"
            echo
            echo '```'
            cat dist/TOOLCHAIN-SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
