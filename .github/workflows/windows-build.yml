name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Godot version
        id: godot
        run: echo "version=$(tr -d '[:space:]' < .github/godot-version.txt)" >> "$GITHUB_OUTPUT"
      - name: Install Godot
        run: |
          set -euo pipefail
          V="${{ steps.godot.outputs.version }}"
          curl --fail --location --retry 4 --retry-all-errors -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${V}_linux.x86_64" godot
          chmod +x godot
          ./godot --version
      - name: Install Windows export templates
        run: |
          set -euo pipefail
          V="${{ steps.godot.outputs.version }}"
          mkdir -p "$HOME/.local/share/godot/export_templates/${V}"
          curl --fail --location --retry 4 --retry-all-errors -o templates.tpz "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          unzip -q templates.tpz -d templates
          cp -R templates/templates/* "$HOME/.local/share/godot/export_templates/${V}/"
      - name: Validate project
        run: ./godot --headless --path . --editor --quit
      - name: Build Windows x64
        run: |
          mkdir -p build
          ./godot --headless --path . --export-release "Windows Desktop" build/VANTA.exe
      - name: Package
        run: |
          cd build
          zip -9 VANTA-windows-x64.zip VANTA.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-windows-x64
          path: build/VANTA-windows-x64.zip
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/VANTA-windows-x64.zip
